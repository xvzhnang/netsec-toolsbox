<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload critical font -->
    <link rel="preload" href="/fonts/fonts/webfonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <!-- pink.css is now imported in main.ts for better bundling -->
    <title>netsec-toolbox</title>
  </head>
  <body>
    <div id="app">
      <!-- 
        Critical CSS & Skeleton for Instant Feedback 
        This is rendered immediately by the browser before any JS is loaded.
        It eliminates the "White Screen" flash.
      -->
      <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #020617; }
        .app-loader {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          z-index: 9999;
          background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        }
        .loader-logo { font-size: 64px; margin-bottom: 24px; animation: pulse 2s infinite; }
        .loader-bar-bg {
          width: 180px; height: 4px; background: rgba(148, 163, 184, 0.2); border-radius: 2px; overflow: hidden;
        }
        .loader-bar {
          width: 50%; height: 100%; background: #4da3ff;
          animation: slide 1.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.95); } }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
      </style>
      <div class="app-loader">
        <div class="loader-logo">🛡️</div>
        <div class="loader-bar-bg"><div class="loader-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
