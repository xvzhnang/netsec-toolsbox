<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #020617;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #0d1117;
        opacity: 1;
        transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
      }
      #boot-loader.boot-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-logo {
        font-size: 64px;
        margin-bottom: 24px;
      }
      .boot-bar-bg {
        width: 180px;
        height: 4px;
        background: #21262d;
        border-radius: 2px;
        overflow: hidden;
      }
      .boot-bar {
        width: 50%;
        height: 100%;
        background: #1f6feb;
        animation: bootSlide 1.5s infinite ease-in-out;
      }
      @keyframes bootSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>
    <title>netsec-toolbox</title>
  </head>
  <body>
    <div id="boot-loader">
      <div class="boot-logo">🛡️</div>
      <div class="boot-bar-bg"><div class="boot-bar"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
